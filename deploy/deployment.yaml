apiVersion: apps/v1
kind: Deployment
metadata:
  name: ep04-admin-frontend
  namespace: ep04-admin-frontend
  labels:
    app.kubernetes.io/name: ep04-admin-frontend
    app.kubernetes.io/part-of: ep04
spec:
  # Sin replicas: las gestiona el HPA (minReplicas 2); fijarlas aqui haria que Argo CD las revierta.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ep04-admin-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ep04-admin-frontend
        app.kubernetes.io/part-of: ep04
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ep04-admin-frontend
      containers:
        - name: frontend
          image: 113585321470.dkr.ecr.us-east-1.amazonaws.com/ep04-admin-frontend:0.1.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: ep04-admin-frontend-config
                  key: API_UPSTREAM
            - name: COGNITO_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: ep04-admin-frontend-config
                  key: COGNITO_DOMAIN
            - name: COGNITO_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: ep04-admin-frontend-config
                  key: COGNITO_CLIENT_ID
            - name: COGNITO_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: ep04-admin-frontend-config
                  key: COGNITO_REDIRECT_URI
            - name: COGNITO_LOGOUT_URI
              valueFrom:
                configMapKeyRef:
                  name: ep04-admin-frontend-config
                  key: COGNITO_LOGOUT_URI
            - name: COGNITO_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: ep04-admin-frontend-config
                  key: COGNITO_SCOPES
            - name: LOCAL_LOGIN
              valueFrom:
                configMapKeyRef:
                  name: ep04-admin-frontend-config
                  key: LOCAL_LOGIN
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
