apiVersion: v1
kind: ConfigMap
metadata:
  name: ep04-admin-frontend-config
  namespace: ep04-admin-frontend
  labels:
    app.kubernetes.io/name: ep04-admin-frontend
    app.kubernetes.io/part-of: ep04
data:
  API_UPSTREAM: http://ep04-control-plane.ep04-control-plane.svc.cluster.local:80
  # Dominio sin https://, p. ej. ep04-admin.auth.us-east-1.amazoncognito.com
  COGNITO_DOMAIN: ""
  COGNITO_CLIENT_ID: ""
  # Vacios = https://<host>/auth/callback y https://<host>/login
  COGNITO_REDIRECT_URI: ""
  COGNITO_LOGOUT_URI: ""
  COGNITO_SCOPES: "openid email profile"
  # TEMPORAL: "true" permite entrar sin Cognito (sin autenticacion real).
  # Al configurar COGNITO_DOMAIN y COGNITO_CLIENT_ID, cambiar a "false".
  LOCAL_LOGIN: "true"
