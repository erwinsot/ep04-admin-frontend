apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ep04-admin-frontend
  namespace: ep04-admin-frontend
  labels:
    app.kubernetes.io/name: ep04-admin-frontend
    app.kubernetes.io/part-of: ep04
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ep04-admin-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
