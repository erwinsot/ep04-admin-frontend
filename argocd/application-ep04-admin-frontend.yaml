apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ep04-admin-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/erwinsot/ep04-admin-frontend.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: ep04-admin-frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
