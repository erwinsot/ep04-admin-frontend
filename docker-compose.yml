services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: ep04-admin-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://host.containers.internal:8080}
      VITE_ADMIN_ROLE: ${VITE_ADMIN_ROLE:-admin}
      VITE_ACTOR: ${VITE_ACTOR:-admin-ui}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  node_modules:
